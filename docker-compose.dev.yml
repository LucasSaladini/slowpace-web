services:
  postgres:
    image: postgres:15-alpine
    container_name: slowpace-postgres
    restart: always
    env_file:
      - ./apps/backend/.env.postgres
    ports:
      - "5433:5432"
    volumes:
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    networks:
      - slowpace-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-master_user} -d ${POSTGRES_DB:-slowpace_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile.dev
    container_name: slowpace-api
    restart: always
    ports:
      - "3333:3333"
    env_file:
      - ./apps/backend/.env
    volumes:
      - ./apps/backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - slowpace-network
    command: sh -c "npx prisma generate && npx prisma migrate deploy && npx prisma db seed && npx tsx watch src/server.ts"

  web:
    build:
      context: ./apps/mobile
      dockerfile: Dockerfile.dev
    container_name: slowpace-web
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - ./apps/mobile/.env.local
    volumes:
      - ./apps/mobile:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api
    networks:
      - slowpace-network

volumes:
  postgres_data:

networks:
  slowpace-network:
    driver: bridge