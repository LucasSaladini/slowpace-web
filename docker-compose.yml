services:
  api:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: slowpace-api
    restart: always
    ports:
      - "3333:3333"
    env_file:
      - ./apps/backend/.env
    networks:
      - slowpace-network

  web:
    build:
      context: ./apps/mobile
      dockerfile: Dockerfile
    container_name: slowpace-web
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - ./apps/mobile/.env.local
    networks:
      - slowpace-network

networks:
  slowpace-network:
    driver: bridge