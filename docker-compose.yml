services:
  api:
    build:
      context: ./actions-runner/_work/slowpace-web/slowpace-web/apps/backend
      dockerfile: Dockerfile
    container_name: slowpace-api
    restart: always
    environment:
      - PORT=3333
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      - JWT_SECRET=${JWT_SECRET}
      - COOKIE_SECRET=${COOKIE_SECRET}
    expose:
      - "3333"
    depends_on:
      - postgres
    networks:
      - slowpace-network

  web:
    build:
      context: ./actions-runner/_work/slowpace-web/slowpace-web/apps/mobile
      dockerfile: Dockerfile
    container_name: slowpace-web
    restart: always
    environment:
      - PORT=3000
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - FRONTEND_URL=${FRONTEND_URL}
    expose:
      - "3000"
    networks:
      - slowpace-network

networks:
  slowpace-network:
    driver: bridge