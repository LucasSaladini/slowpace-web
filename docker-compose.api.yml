services:
  slowpace-api:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: slowpace-api
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - ./apps/backend/.env
    networks:
      - slowpace-network

networks:
  slowpace-network:
    external: true