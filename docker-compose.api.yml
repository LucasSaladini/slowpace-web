services:
  slowpace-api:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: slowpace-api
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL
      - JWT_SECRET
      - COOKIE_SECRET
      - FRONTEND_URL
    networks:
      - slowpace-network

networks:
  slowpace-network:
    external: true