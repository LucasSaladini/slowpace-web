name: Deploy Slowpace to Home Server

on:
    push:
        branches: [main]

jobs:
    deploy:
        runs-on: self-hosted

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Create .env file
              run: |
                  echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" > apps/backend/.env
                  echo "PORT=3000" >> apps/backend/.env
                  # add other necessary environment variables here, if needed

            - name: Build and Run Containers
              run: |
                  docker compose -f docker-compose.api.yml down --remove-orphans
                  docker compose -f docker-compose.api.yml up --build -d
                  sleep 5

            - name: Run Prisma Migrations
              run: |
                  # Injeta a string de conexão diretamente no escopo de execução do Prisma
                  docker exec slowpace-api sh -c "DATABASE_URL='${{ secrets.DATABASE_URL }}' npx prisma migrate deploy"
