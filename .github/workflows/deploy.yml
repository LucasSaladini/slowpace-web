name: Deploy Slowpace to Home Server

on:
    push:
        branches: [main]

jobs:
    deploy:
        runs-on: self-hosted

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Build and Run Containers
              env:
                  DATABASE_URL: ${{ secrets.DATABASE_URL }}
                  JWT_SECRET: ${{ secrets.JWT_SECRET }}
                  COOKIE_SECRET: ${{ secrets.COOKIE_SECRET }}
                  FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
              run: |
                  # O compose herda as variáveis acima e injeta direto na memória do container
                  docker compose -f docker-compose.api.yml down --remove-orphans
                  docker compose -f docker-compose.api.yml up --build -d
                  sleep 5

            - name: Run Prisma Migrations
              run: |
                  # Como o container já nasceu com a DATABASE_URL no ambiente,
                  # o prisma.config.ts lê de forma nativa e segura!
                  docker exec slowpace-api npx prisma migrate deploy
